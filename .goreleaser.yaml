version: 2

project_name: szwm

builds:
  - main: ./cmd/szwm
    binary: szwm
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/HonzaTuron/seznam-webmaster-cli/internal/buildinfo.Version={{ .Version }}
      - -X github.com/HonzaTuron/seznam-webmaster-cli/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/HonzaTuron/seznam-webmaster-cli/internal/buildinfo.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - README.cs.md
      - skills/seznam-webmaster/SKILL.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
